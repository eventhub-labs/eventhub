services:
  postgres:
    image: postgres:17
    container_name: eventhub-postgres

    environment:
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "5432:5432"

    volumes:
      - eventhub_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: eventhub-adminer

    ports:
      - "8081:8080"

    depends_on:
      - postgres

volumes:
  eventhub_postgres_data: