spring.datasource.url=jdbc:postgresql://localhost:5432/eventhub
spring.datasource.username=eventhub
spring.datasource.password=eventhub

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.access-secret=${JWT_ACCESS_SECRET}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.jwt.access-ttl=900
app.jwt.refresh-ttl=1209600